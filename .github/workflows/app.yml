name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/generate_app_icons.py"
  pull_request:
    paths:
      - "app/**"
      - "scripts/generate_app_icons.py"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  app:
    name: Flutter (analyze, test, APK/AAB + SHA-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Unit tests
        working-directory: app
        run: flutter test

      - name: Configure release signing (optional)
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set; Gradle will use debug signing."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Write build defines
        working-directory: app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jchjfdpkmmaxddysylxs.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaGpmZHBrbW1heGRkeXN5bHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MTY3ODEsImV4cCI6MjExMTI5Mjc4MX0.y_mLFpL4k4YLaL-hrUr1BQPw1t9gVViEyr2dNK3hIn4' }}
          GOOGLE_WEB_CLIENT_ID: "132450727224-h5497qleumse5s1p2rdqe80b3u7olks7.apps.googleusercontent.com"
        run: |
          cat > env/ci.json <<EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "API_BASE_URL": "https://www.promptindo.app",
            "GOOGLE_WEB_CLIENT_ID": "$GOOGLE_WEB_CLIENT_ID",
            "SITE_URL": "https://www.promptindo.app"
          }
          EOF

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define-from-file=env/ci.json

      - name: Build release AAB
        working-directory: app
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define-from-file=env/ci.json

      - name: Gradle signing report
        working-directory: app/android
        run: ./gradlew signingReport | tee ../signing-report.txt

      - name: Print signing SHA-1
        working-directory: app
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signing.txt
          SHA1="$(grep -iE 'SHA-1.*(digest|fingerprint)' apk-signing.txt | head -1 | sed 's/.*: //')"
          SHA256="$(grep -iE 'SHA-256.*(digest|fingerprint)' apk-signing.txt | head -1 | sed 's/.*: //')"
          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "Could not read SHA-1/SHA-256 from APK" >&2
            exit 1
          fi
          {
            echo "SHA-1: $SHA1"
            echo "SHA-256: $SHA256"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SHA1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptindo-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
            app/apk-signing.txt
            app/signing-report.txt
          if-no-files-found: warn

      - name: Prepare release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/app/outputs/flutter-apk/app-release.apk promptindo.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PromptIndo Android v1.0.${{ github.run_number }}
          body: |
            PromptIndo Android build from `${{ github.sha }}`.

            Download `promptindo.apk` below and install it on your Android device.
          files: promptindo.apk
          make_latest: true
          fail_on_unmatched_files: true
